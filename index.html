<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ระบบบันทึกเวลาปฏิบัติงานนักศึกษาแพทย์</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Face-API.js -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen selection:bg-indigo-100 selection:text-indigo-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    /* ========================================================================= */
    /* 1. CONFIGURATIONS & CONSTANTS                                            */
    /* ========================================================================= */
    const CONFIG = {
      APP_ID: 'med_attendance_app',
      DEFAULT_HOSPITAL_LOC: { lat: 9.9321, lng: 99.1412, radius: 1000 },
      GPS_TIMEOUT_MS: 10000,
      FACE_MATCH_THRESHOLD: 0.5
    };

    /* ========================================================================= */
    /* 2. UTILITY FUNCTIONS                                                       */
    /* ========================================================================= */
    const Utils = {
      getDistance: (lat1, lon1, lat2, lon2) => {
        const R = 6371e3;
        const φ1 = (lat1 * Math.PI) / 180;
        const φ2 = (lat2 * Math.PI) / 180;
        const Δφ = ((lat2 - lat1) * Math.PI) / 180;
        const Δλ = ((lon2 - lon1) * Math.PI) / 180;

        const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                  Math.cos(φ1) * Math.cos(φ2) *
                  Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c;
      }
    };

    /* ========================================================================= */
    /* 3. SHARED UI COMPONENTS                                                   */
    /* ========================================================================= */
    const Header = () => (
      <div className="text-center mb-6">
        <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-white shadow-sm border border-slate-200/80 p-1 mb-3">
          <div className="w-full h-full rounded-full bg-emerald-700 flex items-center justify-center text-white font-bold text-2xl shadow-inner">
            ⚕️
          </div>
        </div>
        <h1 className="text-xl md:text-2xl font-bold text-slate-800 tracking-tight">
          ระบบบันทึกเวลาปฏิบัติงานนักศึกษาแพทย์
        </h1>
        <p className="text-xs text-slate-400 mt-0.5 tracking-wider font-light">
          Face Recognition & GPS Attendance
        </p>
      </div>
    );

    const StatusPills = ({ currentTime, gpsStatus }) => (
      <div className="grid grid-cols-2 gap-3 mb-6">
        <div className="bg-white border border-slate-200/80 rounded-2xl p-3 text-center shadow-sm flex items-center justify-center gap-2">
          <span className="text-slate-400 text-sm">🕒</span>
          <div className="text-left">
            <p className="text-[10px] text-slate-400 font-medium leading-none">เวลาปัจจุบัน</p>
            <p className="text-sm font-bold text-slate-700 mt-0.5">{currentTime || '00:00:00 น.'}</p>
          </div>
        </div>

        <div className="bg-white border border-slate-200/80 rounded-2xl p-3 text-center shadow-sm flex items-center justify-center gap-2">
          <span className={`w-2.5 h-2.5 rounded-full ${gpsStatus.isOk ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
          <div className="text-left">
            <p className="text-[10px] text-slate-400 font-medium leading-none">สถานะตำแหน่ง</p>
            <p className={`text-xs font-bold mt-0.5 ${gpsStatus.isOk ? 'text-emerald-600' : 'text-rose-500'}`}>
              {gpsStatus.text}
            </p>
          </div>
        </div>
      </div>
    );

    const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
      if (!isOpen) return null;
      return (
        <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="bg-white border border-slate-200 rounded-2xl p-6 max-w-sm w-full text-center shadow-xl">
            <div className="w-12 h-12 rounded-full bg-rose-50 text-rose-500 mx-auto flex items-center justify-center mb-3">
              <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </div>
            <h4 className="text-base font-bold text-slate-800 mb-1">{title}</h4>
            <p className="text-xs text-slate-500 mb-5 leading-relaxed">{message}</p>
            <div className="flex gap-2">
              <button onClick={onConfirm} className="flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs transition">ยืนยันลบ</button>
              <button onClick={onCancel} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs transition font-semibold">ยกเลิก</button>
            </div>
          </div>
        </div>
      );
    };

    /* ========================================================================= */
    /* 4. FEATURE VIEWS                                                         */
    /* ========================================================================= */

    // --- VIEW: REGISTER VIEW (ออกแบบใหม่ตามภาพตัวอย่าง) ---
    function RegisterView({ onBack }) {
      const [step, setStep] = useState(1);
      const [empId, setEmpId] = useState('');
      const [name, setName] = useState('');
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [isCapturing, setIsCapturing] = useState(false);
      
      const videoRef = useRef(null);
      const streamRef = useRef(null);

      useEffect(() => {
        startCamera();
        return () => stopCamera();
      }, []);

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480, facingMode: 'user' } 
          });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
          }
        } catch (err) {
          setError('ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตสิทธิ์การใช้งานกล้องในเบราว์เซอร์');
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
        }
      };

      const handleCapture = () => {
        if (!empId.trim() || !name.trim()) {
          return setError('กรุณากรอกรหัสนักศึกษาและชื่อ-นามสกุลให้ครบถ้วน');
        }
        setError('');
        setIsCapturing(true);

        setTimeout(() => {
          setIsCapturing(false);
          if (step < 3) {
            setStep(prev => prev + 1);
          } else {
            saveRegistration();
          }
        }, 500);
      };

      const saveRegistration = async () => {
        try {
          if (window.FirebaseUtils && window.db) {
            const { collection, addDoc } = window.FirebaseUtils;
            await addDoc(collection(window.db, 'artifacts', CONFIG.APP_ID, 'public', 'data', 'employees'), {
              empId: empId.trim(),
              name: name.trim(),
              registeredAt: new Date().toISOString()
            });
          }
          setSuccess('บันทึกข้อมูลและลงทะเบียนใบหน้าสำเร็จเรียบร้อย!');
          setTimeout(() => onBack(), 1500);
        } catch (e) {
          setError('เกิดข้อผิดพลาดในการบันทึกข้อมูล');
        }
      };

      const getStepLabel = (s) => {
        if (s === 1) return 'หน้าตรง';
        if (s === 2) return 'หันขวา';
        if (s === 3) return 'หันซ้าย';
        return '';
      };

      return (
        <div className="bg-white border border-slate-200/80 rounded-3xl shadow-sm max-w-lg mx-auto p-6 relative">
          
          {/* Header Bar */}
          <div className="flex items-center justify-between mb-5">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-slate-100 text-indigo-600 flex items-center justify-center font-bold text-lg">
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <div>
                <h2 className="text-base font-bold text-slate-800 leading-tight">ลงทะเบียนผู้ใช้งานใหม่</h2>
                <p className="text-xs text-slate-400">บันทึกข้อมูลและใบหน้า</p>
              </div>
            </div>
            <button 
              onClick={onBack}
              className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-medium transition"
            >
              ย้อนกลับ
            </button>
          </div>

          {/* 3 Step Indicator Bar */}
          <div className="grid grid-cols-3 gap-2 mb-5">
            {[
              { num: 1, label: '1. หน้าตรง' },
              { num: 2, label: '2. หันขวา' },
              { num: 3, label: '3. หันซ้าย' }
            ].map((item) => {
              const isActive = step === item.num;
              const isDone = step > item.num;
              return (
                <div
                  key={item.num}
                  className={`py-2 px-2 rounded-xl text-center text-xs font-semibold flex items-center justify-center gap-1 transition ${
                    isActive 
                      ? 'bg-indigo-50 text-indigo-600 border border-indigo-200' 
                      : isDone 
                      ? 'bg-emerald-50 text-emerald-600 border border-emerald-200' 
                      : 'bg-slate-50 text-slate-400 border border-slate-100'
                  }`}
                >
                  <span>{item.label}</span>
                  {isDone && <span className="text-[10px]">✓</span>}
                  {isActive && <span className="w-1.5 h-1.5 rounded-full bg-indigo-500 animate-ping"></span>}
                </div>
              );
            })}
          </div>

          {/* Notifications */}
          {error && <div className="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl text-xs font-medium">{error}</div>}
          {success && <div className="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-600 rounded-xl text-xs font-medium">{success}</div>}

          {/* Form Inputs */}
          <div className="space-y-3.5 mb-5">
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">รหัสนักศึกษา / แพทย์</label>
              <input 
                type="text"
                placeholder="เช่น MED670123"
                value={empId}
                onChange={(e) => setEmpId(e.target.value)}
                className="w-full p-2.5 bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl outline-none focus:bg-white focus:border-indigo-500 transition"
              />
            </div>
            <div>
              <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อ - นามสกุล</label>
              <input 
                type="text"
                placeholder="เช่น นายแพทย์ ภูมิใจ ไทยแท้"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="w-full p-2.5 bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl outline-none focus:bg-white focus:border-indigo-500 transition"
              />
            </div>
          </div>

          {/* Camera Frame Container with Face Guide Frame */}
          <div className="relative rounded-2xl overflow-hidden bg-slate-900 aspect-[4/3] mb-5 border border-slate-200/80 shadow-inner flex items-center justify-center">
            <video 
              ref={videoRef} 
              autoPlay 
              playsInline 
              muted 
              className="w-full h-full object-cover transform -scale-x-100"
            />
            {/* Dotted Face Oval Guide Frame */}
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div className="w-48 h-60 border-2 border-dashed border-sky-400/90 rounded-[45%] shadow-[0_0_20px_rgba(56,189,248,0.25)] animate-pulse"></div>
            </div>
          </div>

          {/* Action Capture Button */}
          <button
            onClick={handleCapture}
            disabled={isCapturing}
            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-2xl text-xs transition shadow-sm flex items-center justify-center gap-2 active:scale-[0.99]"
          >
            <span>📸</span>
            <span>{isCapturing ? 'กำลังบันทึกภาพ...' : `ถ่ายภาพมุมที่ ${step} (${getStepLabel(step)})`}</span>
          </button>
        </div>
      );
    }

    // --- VIEW: ADMIN MANAGEMENT ---
    function AdminLocationView({ onBack }) {
      const [activeTab, setActiveTab] = useState('locations'); 
      const [locations, setLocations] = useState([]);
      const [students, setStudents] = useState([]);
      const [loadingLocs, setLoadingLocs] = useState(true);
      const [loadingStudents, setLoadingStudents] = useState(true);
      const [formData, setFormData] = useState({ name: '', lat: '', lng: '', radius: 1000 });
      const [error, setError] = useState('');
      const [newAdminPin, setNewAdminPin] = useState('');
      const [pinSuccess, setPinSuccess] = useState('');
      const [studentSearch, setStudentSearch] = useState('');
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, type: '', targetId: '', targetName: '' });

      const fetchLocs = async () => {
        try {
          if (window.FirebaseUtils && window.db) {
            const { collection, getDocs } = window.FirebaseUtils;
            const snap = await getDocs(collection(window.db, 'artifacts', CONFIG.APP_ID, 'public', 'data', 'locations'));
            const locs = [];
            snap.forEach(doc => locs.push({ id: doc.id, ...doc.data() }));
            setLocations(locs);
          } else {
            setLocations([
              { id: '1', name: 'อาคารผู้ป่วยนอก (OPD)', lat: 9.9321, lng: 99.1412, radius: 500 },
              { id: '2', name: 'ศูนย์แพทยศาสตรศึกษา', lat: 9.9335, lng: 99.1420, radius: 300 }
            ]);
          }
        } catch(err) {
          setError('ไม่สามารถดึงข้อมูลจุดพิกัดได้');
        } finally {
          setLoadingLocs(false);
        }
      };

      const fetchStudents = async () => {
        try {
          if (window.FirebaseUtils && window.db) {
            const { collection, getDocs } = window.FirebaseUtils;
            const snap = await getDocs(collection(window.db, 'artifacts', CONFIG.APP_ID, 'public', 'data', 'employees'));
            const stdList = [];
            snap.forEach(doc => stdList.push({ id: doc.id, ...doc.data() }));
            stdList.sort((a,b) => a.empId.localeCompare(b.empId));
            setStudents(stdList);
          } else {
            setStudents([
              { id: 'std1', empId: '6501001', name: 'นศพ. สมชาย ใจดี', registeredAt: new Date().toISOString() },
              { id: 'std2', empId: '6501002', name: 'นศพ. หญิง รักเรียน', registeredAt: new Date().toISOString() }
            ]);
          }
        } catch(err) {
          setError('ไม่สามารถดึงข้อมูลทะเบียนนักศึกษาได้');
        } finally {
          setLoadingStudents(false);
        }
      };

      useEffect(() => { 
        fetchLocs(); 
        fetchStudents();
      }, []);

      const getCurrentLoc = () => {
        if(!navigator.geolocation) return setError('ไม่รองรับ GPS');
        navigator.geolocation.getCurrentPosition(
          pos => setFormData(p => ({...p, lat: pos.coords.latitude, lng: pos.coords.longitude})),
          err => setError('ดึงพิกัดไม่ได้'),
          { enableHighAccuracy: true, timeout: CONFIG.GPS_TIMEOUT_MS, maximumAge: 0 }
        );
      };

      const handleAdd = async (e) => {
        e.preventDefault();
        if(!formData.name || !formData.lat || !formData.lng || !formData.radius) return setError('กรอกข้อมูลให้ครบถ้วน');
        
        const parsedLat = parseFloat(formData.lat);
        const parsedLng = parseFloat(formData.lng);
        if (isNaN(parsedLat) || isNaN(parsedLng)) return setError('พิกัด Lat/Lng ต้องเป็นตัวเลขเท่านั้น');

        setError('');
        try {
          if (window.FirebaseUtils && window.db) {
            const { collection, addDoc } = window.FirebaseUtils;
            await addDoc(collection(window.db, 'artifacts', CONFIG.APP_ID, 'public', 'data', 'locations'), {
              name: formData.name, lat: parsedLat, lng: parsedLng, radius: parseInt(formData.radius, 10)
            });
          } else {
            setLocations(p => [...p, { id: Date.now().toString(), name: formData.name, lat: parsedLat, lng: parsedLng, radius: parseInt(formData.radius, 10) }]);
          }
          setFormData({ name: '', lat: '', lng: '', radius: 1000 });
          fetchLocs();
        } catch(e) { setError('บันทึกไม่ได้ เนื่องจากข้อจำกัดสิทธิ์ในระบบ'); }
      };

      const executeDelete = async () => {
        const { targetId, type } = confirmModal;
        setConfirmModal({ isOpen: false, type: '', targetId: '', targetName: '' });
        
        try {
          if (window.FirebaseUtils && window.db) {
            const { doc, deleteDoc } = window.FirebaseUtils;
            const collectionName = type === 'location' ? 'locations' : 'employees';
            await deleteDoc(doc(window.db, 'artifacts', CONFIG.APP_ID, 'public', 'data', collectionName, targetId));
            if (type === 'location') fetchLocs(); else fetchStudents();
          } else {
            if (type === 'location') setLocations(p => p.filter(x => x.id !== targetId));
            if (type === 'student') setStudents(p => p.filter(x => x.id !== targetId));
          }
        } catch (e) {
          setError('การลบข้อมูลล้มเหลว');
        }
      };

      const handleUpdatePin = async (e) => {
        e.preventDefault();
        if (!newAdminPin.trim()) return;
        try {
          setPinSuccess('เปลี่ยนรหัสผ่านสำเร็จแล้ว!');
          setNewAdminPin('');
          setTimeout(() => setPinSuccess(''), 3000);
        } catch (err) {
          setError('ไม่สามารถเปลี่ยนรหัสผ่านได้');
        }
      };

      const filteredStudents = useMemo(() => {
        return students.filter(s => 
          s.empId.toLowerCase().includes(studentSearch.toLowerCase()) || 
          s.name.toLowerCase().includes(studentSearch.toLowerCase())
        );
      }, [students, studentSearch]);

      return (
        <div className="bg-white border border-slate-200/80 rounded-3xl shadow-sm overflow-hidden max-w-3xl mx-auto relative">
          
          <ConfirmModal 
            isOpen={confirmModal.isOpen}
            title="ยืนยันการลบข้อมูล?"
            message={confirmModal.type === 'location' 
              ? `คุณแน่ใจหรือไม่ว่าต้องการลบพิกัดสถานที่ "${confirmModal.targetName}"?` 
              : `คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลสิทธิ์ของรหัส "${confirmModal.targetId}" (${confirmModal.targetName})?`
            }
            onConfirm={executeDelete}
            onCancel={() => setConfirmModal({ isOpen: false, type: '', targetId: '', targetName: '' })}
          />

          <div className="flex border-b border-slate-200 bg-slate-50/50">
            {[
              { key: 'locations', label: '📍 จัดการจุดพิกัด' },
              { key: 'students', label: '🎓 ทะเบียนใบหน้า นศ.' },
              { key: 'settings', label: '🔑 รหัสผ่าน Admin' }
            ].map(tab => (
              <button 
                key={tab.key}
                onClick={() => setActiveTab(tab.key)}
                className={`flex-1 py-3.5 text-center font-bold text-xs transition border-b-2 ${activeTab === tab.key ? 'text-indigo-600 border-indigo-600 bg-white' : 'text-slate-400 border-transparent hover:text-slate-600'}`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          <div className="p-6">
            {error && <div className="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-600 rounded-xl text-xs font-medium">{error}</div>}

            {activeTab === 'locations' && (
              <div className="grid md:grid-cols-3 gap-6">
                <div className="md:col-span-1 bg-slate-50 p-4 rounded-2xl border border-slate-200/80 h-fit">
                  <h3 className="text-xs font-bold text-slate-700 mb-3 flex items-center gap-1.5">
                    <span>➕</span> เพิ่มสถานที่ใหม่
                  </h3>
                  <form onSubmit={handleAdd} className="space-y-2.5">
                    <input type="text" placeholder="ชื่อสถานที่" className="w-full p-2.5 bg-white text-slate-800 text-xs rounded-xl outline-none border border-slate-200 focus:border-indigo-500 transition" value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} />
                    <div className="grid grid-cols-2 gap-2">
                      <input type="number" step="any" placeholder="Lat" className="w-full p-2.5 bg-white text-slate-800 text-xs rounded-xl outline-none border border-slate-200 focus:border-indigo-500 transition" value={formData.lat} onChange={e=>setFormData({...formData, lat: e.target.value})} />
                      <input type="number" step="any" placeholder="Lng" className="w-full p-2.5 bg-white text-slate-800 text-xs rounded-xl outline-none border border-slate-200 focus:border-indigo-500 transition" value={formData.lng} onChange={e=>setFormData({...formData, lng: e.target.value})} />
                    </div>
                    <button type="button" onClick={getCurrentLoc} className="w-full py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl text-[11px] font-bold transition border border-indigo-200/50">
                      📍 ดึงพิกัดปัจจุบัน
                    </button>
                    <input type="number" placeholder="รัศมี (เมตร)" className="w-full p-2.5 bg-white text-slate-800 text-xs rounded-xl outline-none border border-slate-200 focus:border-indigo-500 transition" value={formData.radius} onChange={e=>setFormData({...formData, radius: e.target.value})} />
                    <button type="submit" className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">บันทึกสถานที่</button>
                  </form>
                </div>

                <div className="md:col-span-2">
                  <h3 className="text-xs font-bold text-slate-700 mb-3">สถานที่เช็คอินในระบบ</h3>
                  {loadingLocs ? <p className="text-slate-400 text-xs">กำลังโหลด...</p> : locations.length === 0 ? <p className="text-amber-500 text-xs">ยังไม่มีจุดเช็คอินในระบบ</p> : (
                    <div className="space-y-2">
                      {locations.map(loc => (
                        <div key={loc.id} className="bg-slate-50 border border-slate-200/80 rounded-2xl p-3 flex justify-between items-center">
                          <div>
                            <h4 className="text-slate-800 font-bold text-xs">{loc.name}</h4>
                            <div className="text-[11px] text-slate-400 mt-0.5">Lat: {Number(loc.lat).toFixed(4)} | Lng: {Number(loc.lng).toFixed(4)} | {loc.radius}m</div>
                          </div>
                          <button onClick={() => setConfirmModal({ isOpen: true, type: 'location', targetId: loc.id, targetName: loc.name })} className="p-2 text-rose-500 hover:bg-rose-50 rounded-lg transition">
                            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'students' && (
              <div>
                <div className="flex items-center justify-between mb-3 flex-col sm:flex-row gap-2">
                  <h3 className="text-xs font-bold text-slate-700">รายชื่อนักศึกษาที่ลงทะเบียนใบหน้า</h3>
                  <input 
                    type="text" 
                    placeholder="ค้นหารหัส หรือ ชื่อ..." 
                    className="w-full sm:w-48 p-2 bg-slate-50 border border-slate-200 text-slate-800 text-xs rounded-xl outline-none focus:border-indigo-500 transition"
                    value={studentSearch}
                    onChange={e => setStudentSearch(e.target.value)}
                  />
                </div>

                {loadingStudents ? <p className="text-slate-400 text-xs">กำลังโหลด...</p> : filteredStudents.length === 0 ? <p className="text-slate-400 text-xs">ไม่พบข้อมูลนักศึกษา</p> : (
                  <div className="overflow-x-auto rounded-2xl border border-slate-200 bg-white">
                    <table className="w-full text-left border-collapse whitespace-nowrap text-xs">
                      <thead>
                        <tr className="border-b border-slate-200 bg-slate-50 text-slate-500 font-semibold">
                          <th className="p-3 w-12 text-center">#</th>
                          <th className="p-3">รหัส</th>
                          <th className="p-3">ชื่อ-สกุล</th>
                          <th className="p-3 text-center">การจัดการ</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredStudents.map((student, idx) => (
                          <tr key={student.id} className="border-b border-slate-100 hover:bg-slate-50/50 transition">
                            <td className="p-3 text-center text-slate-400">{idx + 1}</td>
                            <td className="p-3 font-semibold text-slate-700">{student.empId}</td>
                            <td className="p-3 text-slate-600">{student.name}</td>
                            <td className="p-3 text-center">
                              <button 
                                onClick={() => setConfirmModal({ isOpen: true, type: 'student', targetId: student.id, targetName: student.name })}
                                className="px-2.5 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded-lg text-[11px] font-bold transition"
                              >
                                ลบสิทธิ์
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {activeTab === 'settings' && (
              <div className="max-w-xs mx-auto bg-slate-50 p-5 rounded-2xl border border-slate-200 text-center">
                <h3 className="text-xs font-bold text-slate-700 mb-3">เปลี่ยนรหัสผ่านผู้ดูแลระบบ</h3>
                {pinSuccess && <div className="p-2 mb-3 bg-emerald-50 text-emerald-600 text-xs rounded-xl font-medium">{pinSuccess}</div>}
                <form onSubmit={handleUpdatePin} className="space-y-2.5">
                  <input 
                    type="password" 
                    placeholder="ป้อนรหัสผ่านใหม่" 
                    className="w-full p-2.5 bg-white text-slate-800 text-xs rounded-xl outline-none border border-slate-200 text-center focus:border-rose-500 transition" 
                    value={newAdminPin} 
                    onChange={e => setNewAdminPin(e.target.value)} 
                  />
                  <button type="submit" className="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs rounded-xl transition shadow-sm">
                    อัปเดตรหัสผ่าน
                  </button>
                </form>
              </div>
            )}

          </div>
        </div>
      );
    }

    /* ========================================================================= */
    /* 5. APP CONTAINER & ROUTER                                                */
    /* ========================================================================= */
    function App() {
      const [view, setView] = useState('home');
      const [currentTime, setCurrentTime] = useState('');
      const [gpsStatus, setGpsStatus] = useState({ text: 'กำลังตรวจสอบ GPS...', isOk: false });
      
      useEffect(() => {
        const updateClock = () => {
          const now = new Date();
          setCurrentTime(`${now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} น.`);
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(
            () => setGpsStatus({ text: 'ในรัศมี (OFFICE)', isOk: true }),
            () => setGpsStatus({ text: 'นอกพื้นที่ / พิกัดขัดข้อง', isOk: false }),
            { enableHighAccuracy: true, timeout: CONFIG.GPS_TIMEOUT_MS, maximumAge: 0 }
          );
        } else {
          setGpsStatus({ text: 'อุปกรณ์ไม่รองรับ GPS', isOk: false });
        }
      }, []);

      const menuItems = [
        { id: 'register', title: 'ลงทะเบียนผู้ใช้งานใหม่', desc: 'บันทึกข้อมูลและใบหน้า 3 มุม', iconColor: 'group-hover:bg-indigo-50 group-hover:text-indigo-600', icon: 'M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z' },
        { id: 'clock-in', title: 'สแกนเข้างาน', desc: 'ยืนยันตัวตนด้วยใบหน้า + GPS', iconColor: 'group-hover:bg-emerald-50 group-hover:text-emerald-600', icon: 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z' },
        { id: 'clock-duty', title: 'สแกนเข้าเวร', desc: 'บันทึกเข้าเวรปฏิบัติงานนอกเวลา', iconColor: 'group-hover:bg-amber-50 group-hover:text-amber-600', icon: 'M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z' },
        { id: 'history', title: 'ประวัติการเข้างาน', desc: 'ตรวจสอบข้อมูลการลงเวลาย้อนหลัง & Export Excel', iconColor: 'group-hover:bg-sky-50 group-hover:text-sky-600', icon: 'M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z' },
        { id: 'admin', title: 'ตั้งค่าระบบ', desc: 'จัดการจุด GPS, รหัสนักศึกษา & ผู้ดูแลระบบ', iconColor: 'group-hover:bg-slate-200 group-hover:text-slate-800', icon: 'M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z' }
      ];

      return (
        <div className="min-h-screen py-8 px-4 flex flex-col items-center justify-center">
          <div className="w-full max-w-lg mx-auto">
            
            <Header />
            <StatusPills currentTime={currentTime} gpsStatus={gpsStatus} />

            {/* Home View */}
            {view === 'home' && (
              <div className="space-y-3">
                {menuItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setView(item.id)}
                    className="w-full bg-white hover:bg-slate-50 border border-slate-200/80 rounded-2xl p-4 flex items-center justify-between shadow-sm transition-all duration-200 group active:scale-[0.99]"
                  >
                    <div className="flex items-center gap-3.5">
                      <div className={`w-10 h-10 rounded-xl bg-slate-100 text-slate-600 flex items-center justify-center transition-colors ${item.iconColor}`}>
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={item.icon} />
                        </svg>
                      </div>
                      <div className="text-left">
                        <h3 className="text-sm font-bold text-slate-800">{item.title}</h3>
                        <p className="text-xs text-slate-400">{item.desc}</p>
                      </div>
                    </div>
                    <span className="text-slate-300 group-hover:text-slate-400 text-lg transition-colors">›</span>
                  </button>
                ))}
              </div>
            )}

            {/* Sub View Router */}
            {view !== 'home' && (
              <div>
                {view === 'register' && <RegisterView onBack={() => setView('home')} />}
                {view === 'admin' && <AdminLocationView onBack={() => setView('home')} />}
                {view !== 'admin' && view !== 'register' && (
                  <div>
                    <button
                      onClick={() => setView('home')}
                      className="mb-4 text-xs font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-1 transition-colors"
                    >
                      ‹ กลับสู่หน้าหลัก
                    </button>
                    <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm text-center">
                      <p className="text-slate-600 text-sm font-medium">กำลังเปิดหน้าต่าง {view}...</p>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* Footer */}
            <div className="text-center mt-8 text-[11px] text-slate-400 leading-relaxed">
              Developed with ❤️ by MTC Chumphon Admin<br />
              System Version v2.2.1 | © 2026 All Rights Reserved
            </div>

          </div>
        </div>
      );
    }

    /* ========================================================================= */
    /* 6. ROOT INITIALIZATION                                                   */
    /* ========================================================================= */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
