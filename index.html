    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.12);
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'scan') {
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          osc.start();
          osc.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {
        console.warn("Audio Context Playback error:", e);
      }
    };

    function HomeView({ db, setView, setCheckInType, workSchedule }) {

        try {
          const { collection, getDocs } = window.FirebaseUtils;
          const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'history'));
          const logs = [];
          const todayStr = new Date().toDateString();

          let totalCount = 0, lateCount = 0, inCount = 0, shiftCount = 0;

          snap.forEach(doc => {
            const data = doc.data();
            const logDate = new Date(data.timestamp);
            if (logDate.toDateString() === todayStr) {

              if (data.type === 'normal-in') inCount++;
              if (data.type === 'shift-in') shiftCount++;
              if (data.remark && data.remark.includes('สาย')) lateCount++;
            }
            logs.push({ id: doc.id, ...data });
          });

          setTodayStats({ total: totalCount, late: lateCount, normalIn: inCount, shiftIn: shiftCount });

    function RegisterView({ db, goHome }) {
      const [step, setStep] = useState(1); 
      const [formData, setFormData] = useState({ empId: '', name: '' });
      const [descriptors, setDescriptors] = useState([]);
      const [error, setError] = useState('');
      const [isProcessing, setIsProcessing] = useState(false);
      const [loadingMsg, setLoadingMsg] = useState('');
      const videoRef = useRef(null);

      useEffect(() => { return () => stopCamera(); }, []);

      const stopCamera = () => {
        if (videoRef.current && videoRef.current.srcObject) {
          videoRef.current.srcObject.getTracks().forEach(track => track.stop());
        }
      };

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.onloadedmetadata = () => {
              videoRef.current.play();
            };
          }
        } catch (err) {
          setError('ไม่สามารถเข้าถึงกล้องได้ กรุณาตรวจสอบการอนุญาตใช้งานกล้อง');
        }
      };

      const handleInfoSubmit = async (e) => {
        e.preventDefault();
        if (!formData.empId.trim() || !formData.name.trim()) return setError('กรุณากรอกข้อมูลให้ครบถ้วน');
        
        setIsProcessing(true);
        setError('');
        try {
          const { doc, getDoc } = window.FirebaseUtils;
          const empRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'employees', formData.empId.trim());
          const docSnap = await getDoc(empRef);
          
          if (docSnap.exists()) {
            setError('รหัสนี้มีการลงทะเบียนแล้วในระบบ');
            setIsProcessing(false);
            return;
          }
          setStep(2);
          startCamera();
        } catch (err) {
          setError('เกิดข้อผิดพลาดในการตรวจสอบข้อมูล: ' + err.message);

        setIsProcessing(false);

      const captureFace = async (currentStep) => {
        if (!videoRef.current || isProcessing) return;
        setIsProcessing(true);
        setError('');

        try {
          await new Promise(r => setTimeout(r, 150));

          const detectorOptions = new window.faceapi.TinyFaceDetectorOptions({

            .detectSingleFace(videoRef.current, detectorOptions)

            setIsProcessing(false);
            return;
          }

          playSound('scan');
          const descriptorArray = Array.from(detection.descriptor);
          const newDescriptors = [...descriptors, descriptorArray];
          setDescriptors(newDescriptors);

          if (currentStep === 4) {
            setLoadingMsg('กำลังบันทึกข้อมูลโพรไฟล์ลงฐานข้อมูล...');
            await saveEmployee(newDescriptors);
          } else {
            setStep(currentStep + 1);
          }
        } catch (err) {
          console.error("Scanning Error: ", err);
          setError('เกิดข้อผิดพลาดในการประมวลผลใบหน้า: ' + err.message);

              </div>
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อ - นามสกุล</label>
                <input type="text" className="w-full p-3.5 bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-100 text-slate-900 rounded-xl outline-none transition font-medium" placeholder="เช่น นศ.พ. ใจดี รักเรียน" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} disabled={isProcessing} />
              </div>
              <button type="submit" disabled={isProcessing} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl mt-4 transition shadow-md shadow-indigo-600/20">
                {isProcessing ? 'กำลังตรวจสอบ...' : 'ถัดไป: เริ่มสแกนใบหน้า'}
              </button>
            </form>

          {[2, 3, 4].includes(step) && (
            <div className="flex flex-col items-center text-center">
              <span className="text-xs font-extrabold uppercase tracking-widest text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full mb-2">ขั้นตอนที่ {step - 1}/3</span>
              <h3 className="text-lg font-bold text-slate-900 mb-1">
                {step === 2 ? "กรุณาหันหน้าตรงและมองกล้อง" : step === 3 ? "กรุณาเอียงหน้าไปทางซ้ายเล็กน้อย" : "กรุณาเอียงหน้าไปทางขวาเล็กน้อย"}

              <div className="relative w-full max-w-md aspect-[4/3] bg-slate-900 rounded-2xl overflow-hidden mb-6 border border-slate-300 shadow-inner">
                <video ref={videoRef} autoPlay muted playsInline className="w-full h-full object-cover scale-x-[-1]" />
                <div className="absolute inset-0 border-2 border-indigo-400/80 m-10 rounded-full pointer-events-none animate-pulse shadow-[0_0_0_9999px_rgba(15,23,42,0.45)]"></div>
              </div>

              <button onClick={() => captureFace(step)} disabled={isProcessing} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-8 rounded-xl flex items-center justify-center gap-2 transition shadow-md shadow-indigo-600/20 w-full max-w-md">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" className="w-5 h-5"><path strokeLinecap="round" strokeLinejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" /><path strokeLinecap="round" strokeLinejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" /></svg>
                {isProcessing ? (loadingMsg || 'กำลังประมวลผล...') : 'บันทึกภาพถ่ายสแกน'}
              </button>
            </div>
          )}

          {step === 5 && (
            <div className="text-center py-8">
              <div className="w-20 h-20 bg-emerald-100 border-4 border-emerald-200 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce-short">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="3" stroke="currentColor" className="w-10 h-10 text-emerald-600"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              </div>
              <h3 className="text-xl font-bold text-slate-900 mb-1">ลงทะเบียนใบหน้าสำเร็จ!</h3>
              <p className="text-slate-500 text-sm mb-6">ข้อมูลถูกจัดเก็บเรียบร้อย สามารถสแกนบันทึกเวลาได้ทันที</p>
              <button onClick={goHome} className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 rounded-xl transition shadow-md">กลับหน้าหลัก</button>

    function CheckInView({ db, checkInType, goHome, workSchedule }) {
      const [step, setStep] = useState('init'); 
      const [locationStatus, setLocationStatus] = useState('กำลังเตรียมพร้อมข้อมูลการสแกน...');
      const [error, setError] = useState('');
      const [matchData, setMatchData] = useState(null);
      const [matchedLocation, setMatchedLocation] = useState(''); 
      const [rawLocation, setRawLocation] = useState({ lat: null, lng: null });
      const [faceMatcher, setFaceMatcher] = useState(null);
      const [autoScanStatus, setAutoScanStatus] = useState('กำลังเริ่มต้นกล้องตรวจจับ...');
      
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const scanIntervalRef = useRef(null);
      const isAnalyzingRef = useRef(false);

      useEffect(() => { 
        if (step === 'init') {
          loadEmployeesData();
        } else if (step === 'location') {
          checkLocation(); 
        } else if (step === 'camera') {
          startCamera();
        }
        return () => {
          stopCamera();
          stopAutoScan();
        }; 
      }, [step]);

      const loadEmployeesData = async () => {
        try {
          const { collection, getDocs } = window.FirebaseUtils;
          const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'employees'));
          const labeledDescriptors = [];
          
          snap.forEach(doc => {
            const data = doc.data();
            if (data.descriptors) {
              try {
                const parsedDescs = JSON.parse(data.descriptors).map(d => new Float32Array(d));
                labeledDescriptors.push(new window.faceapi.LabeledFaceDescriptors(data.empId + "|||" + data.name, parsedDescs));
              } catch (e) { console.error("Bad descriptor data", e) }
            }
          });
          
          if (labeledDescriptors.length > 0) {
            setFaceMatcher(new window.faceapi.FaceMatcher(labeledDescriptors, 0.45));
          }
          setStep('location');
        } catch (err) {
          setError('ไม่สามารถโหลดฐานข้อมูลพนักงานได้: ' + err.message);
        }
      };

      const stopCamera = () => {
        if (videoRef.current && videoRef.current.srcObject) {
          videoRef.current.srcObject.getTracks().forEach(track => track.stop());
        }
      };

      const startAutoScan = () => {
        stopAutoScan();
        scanIntervalRef.current = setInterval(() => {
          if (!isAnalyzingRef.current && videoRef.current && videoRef.current.readyState === 4) {
            runRealTimeMatch();
          }
        }, 350); 
      };

      const stopAutoScan = () => {
        if (scanIntervalRef.current) {
          clearInterval(scanIntervalRef.current);
          scanIntervalRef.current = null;
        }
      };

      const getDistance = (lat1, lon1, lat2, lon2) => {
        const R = 6371e3; 
        const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
      };

      const checkLocation = async () => {
        setLocationStatus('กำลังตรวจสอบพิกัด GPS ปัจจุบัน...');
        if (!navigator.geolocation) return setError('อุปกรณ์ไม่รองรับระบบตรวจสอบตำแหน่ง (GPS)');
        try {
          const { collection, getDocs } = window.FirebaseUtils;
          const locSnap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'locations'));
          const activeLocations = [];
          locSnap.forEach(doc => activeLocations.push({ id: doc.id, ...doc.data() }));

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              const { latitude, longitude } = pos.coords;
              setRawLocation({ lat: latitude, lng: longitude }); 
              let isAllowed = false, minDistance = Infinity, matchedLocName = '';

              for (const loc of activeLocations) {
                const distance = getDistance(latitude, longitude, loc.lat, loc.lng);
                if (distance < minDistance) minDistance = distance;
                if (distance <= loc.radius) { 
                  isAllowed = true; 
                  matchedLocName = loc.name;
                  break; 
                }
              }

              if (activeLocations.length === 0) {
                minDistance = getDistance(latitude, longitude, WORKPLACE_LAT, WORKPLACE_LON);
                if (minDistance <= ALLOWED_RADIUS_METERS) {
                  isAllowed = true;
                  matchedLocName = 'พิกัดโรงพยาบาลปฏิบัติการ';
                }
              }

              if (isAllowed) { 
                setMatchedLocation(matchedLocName);
                if (!faceMatcher) {
                  setError('ยังไม่มีข้อมูลพนักงานในระบบ กรุณาลงทะเบียนใบหน้าก่อนใช้งาน');
                } else {
                  setStep('camera'); 
                }
              } else {
                playSound('error');
                setError(`คุณอยู่นอกเขตพื้นที่ลงเวลาปฏิบัติงาน (ระยะห่างจุดใกล้สุด ~${Math.round(minDistance)} เมตร)`);
                setLocationStatus('ไม่อนุญาตให้สแกนบันทึกเวลา');
              }
            },
            (err) => {
              playSound('error');
              setError('ไม่สามารถระบุตำแหน่ง GPS ได้ กรุณาเปิดบริการ Location บนมือถือ');
              setLocationStatus('ข้อผิดพลาดทางพิกัด');
            }, 
            { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 }
          );
        } catch (err) { setError('เกิดข้อผิดพลาด: ' + err.message); }
      };

      const startCamera = async () => {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.onloadedmetadata = () => {
              videoRef.current.play();
              startAutoScan();
            };
          }
        } catch (err) { 
          setError('ไม่สามารถเปิดกล้องได้ กรุณาให้สิทธิ์การใช้งานกล้องในเบราว์เซอร์'); 
        }
      };

      const checkLateStatus = (type) => {
        const now = new Date();
        const currentMins = now.getHours() * 60 + now.getMinutes();

        const parseTargetMins = (timeStr) => {
          if(!timeStr) return 0;
          const [h, m] = timeStr.split(':').map(Number);
          return h * 60 + m;
        };

        if (type === 'normal-in' && currentMins > parseTargetMins(workSchedule.normalIn)) {
          return 'เข้างานสาย';
        }
        if (type === 'shift-in' && currentMins > parseTargetMins(workSchedule.shiftIn)) {
          return 'เข้าเวรสาย';
        }
        return '';
      };

      const runRealTimeMatch = async () => {
        if (isAnalyzingRef.current || !faceMatcher || !videoRef.current) return;
        isAnalyzingRef.current = true;

        try {
          const detectorOptions = new window.faceapi.TinyFaceDetectorOptions({ 
            inputSize: 320, 
            scoreThreshold: 0.25 
          });

          const detection = await window.faceapi
            .detectSingleFace(videoRef.current, detectorOptions)
            .withFaceLandmarks()
            .withFaceDescriptor();

          const canvas = canvasRef.current;
          if (canvas && videoRef.current) {
            const displaySize = { width: videoRef.current.clientWidth, height: videoRef.current.clientHeight };
            window.faceapi.matchDimensions(canvas, displaySize);

            if (detection) {
              const resizedDetections = window.faceapi.resizeResults(detection, displaySize);
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, canvas.width, canvas.height);
              
              // Draw custom box overlay
              const box = resizedDetections.detection.box;
              ctx.strokeStyle = '#6366f1';
              ctx.lineWidth = 3;
              ctx.strokeRect(canvas.width - box.x - box.width, box.y, box.width, box.height); // Flip X for mirrored video
            } else {
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
          }

          if (!detection) {
            setAutoScanStatus('กำลังสแกนค้นหาใบหน้า...');
            return;
          }

          setAutoScanStatus('ตรวจพบใบหน้า! กำลังเทียบรหัสโพรไฟล์...');
          const bestMatch = faceMatcher.findBestMatch(detection.descriptor);

          if (bestMatch.label === 'unknown') {
            setAutoScanStatus('กำลังสแกน... (ยังไม่พบใบหน้าตรงในระบบ)');
          } else {
            const [empId, name] = bestMatch.label.split("|||");
            playSound('success');
            stopAutoScan();
            await saveAttendanceLog(empId, name);
          }
        } catch (err) {
          console.error("Auto scan error:", err);
        } finally {
          isAnalyzingRef.current = false;
        }
      };

      const saveAttendanceLog = async (empId, name) => {
        try {
          const { doc, setDoc, collection } = window.FirebaseUtils;
          const logId = Date.now().toString();
          const remarkValue = checkLateStatus(checkInType);

          await setDoc(doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'history'), logId), {
            empId, 
            name, 
            timestamp: new Date().toISOString(), 
            type: checkInType,
            locationName: matchedLocation,
            lat: rawLocation ? rawLocation.lat : null,
            lng: rawLocation ? rawLocation.lng : null,
            remark: remarkValue 
          });
          setMatchData({ empId, name, locationName: matchedLocation, remark: remarkValue }); 
          stopCamera(); 
          setStep('success');
        } catch (err) { setError('บันทึกประวัติล้มเหลว: ' + err.message); }
      };

      const getTypeBadge = () => {
        switch (checkInType) {
          case 'normal-in': return { text: 'เข้างานปกติ', badge: 'bg-emerald-100 text-emerald-800 border-emerald-300' };
          case 'normal-out': return { text: 'ออกงานปกติ', badge: 'bg-rose-100 text-rose-800 border-rose-300' };
          case 'shift-in': return { text: 'เข้าเวร', badge: 'bg-amber-100 text-amber-800 border-amber-300' };
          case 'shift-out': return { text: 'ออกเวร', badge: 'bg-purple-100 text-purple-800 border-purple-300' };
          default: return { text: 'บันทึกเวลา', badge: 'bg-indigo-100 text-indigo-800 border-indigo-300' };
        }
      };

      const badgeInfo = getTypeBadge();

      return (
        <div className="bg-white border border-slate-200 rounded-3xl shadow-lg max-w-2xl mx-auto p-6 md:p-8 mb-8">
          {error && (

          {['init', 'location'].includes(step) && !error && (

      const [records, setRecords] = useState([]);

      const [fetchError, setFetchError] = useState('');

      useEffect(() => {
        fetchHistory();
      }, []);

      const fetchHistory = async () => {
        setLoading(true);
        setFetchError('');
        try {
          const { collection, getDocs } = window.FirebaseUtils;
          const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'history'));
          const data = [];
          snap.forEach(doc => data.push({ id: doc.id, ...doc.data() }));
          
          data.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          setRecords(data);
        } catch (err) {
          console.error("Fetch history error:", err);
          setFetchError('ไม่สามารถดึงข้อมูลประวัติการเข้างานได้: ' + err.message);
        }
        setLoading(false);
      };

      const exportCSV = () => {
        if(filteredRecords.length === 0) return;
        const headers = ["วันที่", "เวลา", "รหัส", "ชื่อ-สกุล", "ประเภท", "สถานที่", "หมายเหตุ"];
        const rows = filteredRecords.map(r => {
          const dt = new Date(r.timestamp);
          return [
            dt.toLocaleDateString('th-TH'),
            dt.toLocaleTimeString('th-TH'),
            r.empId,
            `"${r.name}"`,
            getTypeLabel(r.type),
            `"${r.locationName || ''}"`,
            `"${r.remark || ''}"`
          ].join(",");
        });
        
        const csvContent = "\uFEFF" + headers.join(",") + "\n" + rows.join("\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Attendance_Report_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const getTypeLabel = (type) => {
        if(type === 'normal-in') return 'เข้างาน';
        if(type === 'normal-out') return 'ออกงาน';
        if(type === 'shift-in') return 'เข้าเวร';
        if(type === 'shift-out') return 'ออกเวร';
        return type;
      };

      const getTypeColor = (type) => {
        if(type === 'normal-in') return 'bg-emerald-50 text-emerald-700 border-emerald-200';
        if(type === 'normal-out') return 'bg-rose-50 text-rose-700 border-rose-200';
        if(type === 'shift-in') return 'bg-amber-50 text-amber-700 border-amber-200';
        if(type === 'shift-out') return 'bg-purple-50 text-purple-700 border-purple-200';
        return 'bg-slate-100 text-slate-700 border-slate-200';
      };

      const filteredRecords = useMemo(() => {
        return records.filter(r => {
          const matchesSearch = (r.name && r.name.toLowerCase().includes(filterSearch.toLowerCase())) || 
                                (r.empId && r.empId.includes(filterSearch));
          const matchesType = filterType === 'all' || r.type === filterType;
          
          let matchesDate = true;
          if (startDate || endDate) {
            const recordDate = new Date(r.timestamp).setHours(0,0,0,0);
            if (startDate) {
              const start = new Date(startDate).setHours(0,0,0,0);
              if (recordDate < start) matchesDate = false;
            }
            if (endDate) {
              const end = new Date(endDate).setHours(23,59,59,999);
              if (recordDate > end) matchesDate = false;
            }
          }

          return matchesSearch && matchesType && matchesDate;
        });
      }, [records, filterSearch, filterType, startDate, endDate]);

      return (
        <div className="bg-white border border-slate-200 rounded-3xl shadow-lg p-5 md:p-6 mb-8">

                className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs outline-none focus:border-indigo-500 focus:bg-white transition"
                value={filterSearch}
                onChange={e => setFilterSearch(e.target.value)}
              />
              <select 
                value={filterType} 
                onChange={e => setFilterType(e.target.value)}
                className="p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs outline-none focus:border-indigo-500 transition font-medium"
              >
                <option value="all">แสดงประเภททั้งหมด</option>
                <option value="normal-in">เข้างานปกติ</option>
                <option value="normal-out">ออกงานปกติ</option>
                <option value="shift-in">เข้าเวร</option>
                <option value="shift-out">ออกเวร</option>
              </select>
              <button onClick={exportCSV} disabled={filteredRecords.length === 0} className="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white text-xs font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                ส่งออก CSV ({filteredRecords.length})
              </button>
            </div>

            <div className="flex flex-wrap items-center gap-2 bg-slate-50 p-3 rounded-2xl border border-slate-200 text-xs">

              {(startDate || endDate || filterType !== 'all' || filterSearch) && (
                <button onClick={() => { setStartDate(''); setEndDate(''); setFilterType('all'); setFilterSearch(''); }} className="text-indigo-600 hover:underline text-xs font-bold ml-auto">
                  ล้างตัวกรอง

              )}
            </div>
          </div>

          <div className="overflow-x-auto rounded-2xl border border-slate-200">
            <table className="w-full text-left text-xs whitespace-nowrap">
              <thead className="bg-slate-50 text-slate-700 font-bold border-b border-slate-200 uppercase tracking-wider">

              <tbody className="divide-y divide-slate-100">
                {loading ? (
                  <tr><td colSpan="5" className="text-center py-8 text-slate-400">กำลังดึงข้อมูลประวัติ...</td></tr>
                ) : filteredRecords.length === 0 ? (

      const [error, setError] = useState('');
      const [studentSearch, setStudentSearch] = useState('');
      const [confirmModal, setConfirmModal] = useState({ isOpen: false, type: '', targetId: '', targetName: '' });

      const fetchLocs = async () => {
        setLoadingLocs(true);
        setError('');
        try {
          const { collection, getDocs } = window.FirebaseUtils;
          const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'locations'));
          const locs = [];
          snap.forEach(doc => locs.push({ id: doc.id, ...doc.data() }));
          setLocations(locs);
        } catch(e) {
          setError('ไม่สามารถดึงข้อมูลพิกัดสถานที่ได้: ' + e.message);
        }
        setLoadingLocs(false);
      };

      const fetchStudents = async () => {
        setLoadingStudents(true);
        setError('');
        try {
          const { collection, getDocs } = window.FirebaseUtils;
          const snap = await getDocs(collection(db, 'artifacts', APP_ID, 'public', 'data', 'employees'));
          const stdList = [];
          snap.forEach(doc => stdList.push({ id: doc.id, ...doc.data() }));
          stdList.sort((a,b) => (a.empId || '').localeCompare(b.empId || ''));
          setStudents(stdList);
        } catch(e) {
          setError('ไม่สามารถดึงข้อมูลพนักงานได้: ' + e.message);
        }
        setLoadingStudents(false);
      };

      useEffect(() => { 
        fetchLocs(); 
        fetchStudents();
      }, [db]);

      const getCurrentLoc = () => {
        if(!navigator.geolocation) return setError('เบราว์เซอร์ไม่รองรับ GPS');
        navigator.geolocation.getCurrentPosition(
          pos => setFormData(p => ({...p, lat: pos.coords.latitude, lng: pos.coords.longitude})),
          err => setError('ไม่สามารถดึงพิกัดปัจจุบันได้'),
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      };

      const handleAdd = async (e) => {
        e.preventDefault();
        setError('');

        const latNum = parseFloat(formData.lat);
        const lngNum = parseFloat(formData.lng);
        const radiusNum = parseInt(formData.radius, 10);

        if (!formData.name.trim()) return setError('กรุณาระบุชื่อสถานที่');
        if (isNaN(latNum) || isNaN(lngNum)) return setError('กรุณาระบุ ละติจูด / ลองจิจูด เป็นตัวเลข');
        if (isNaN(radiusNum) || radiusNum <= 0) return setError('รัศมีต้องมากกว่า 0');

        try {
          const { collection, addDoc } = window.FirebaseUtils;
          await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'locations'), {
            name: formData.name.trim(), 
            lat: latNum, 
            lng: lngNum, 
            radius: radiusNum
          });
          setFormData({ name: '', lat: '', lng: '', radius: 1000 });
          fetchLocs();
        } catch(e) { 
          setError('ไม่สามารถบันทึกได้: ' + e.message); 
        }
      };

      const triggerDeleteLoc = (id, name) => {
        setConfirmModal({ isOpen: true, type: 'location', targetId: id, targetName: name });
      };

      const triggerDeleteStudent = (id, name) => {
        setConfirmModal({ isOpen: true, type: 'student', targetId: id, targetName: name });
      };

      const executeDelete = async () => {
        const { targetId, type } = confirmModal;
        setConfirmModal({ isOpen: false, type: '', targetId: '', targetName: '' });
        
        try {
          const { doc, deleteDoc } = window.FirebaseUtils;
          if (type === 'location') {
            await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'locations', targetId));
            await fetchLocs();
          } else if (type === 'student') {
            await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'employees', targetId));
            await fetchStudents();
          }
        } catch (e) {
          setError('การลบข้อมูลล้มเหลว: ' + e.message);
        }
      };

      const filteredStudents = students.filter(student => 
        (student.empId && student.empId.toLowerCase().includes(studentSearch.toLowerCase())) || 
        (student.name && student.name.toLowerCase().includes(studentSearch.toLowerCase()))
      );

      return (
        <div className="bg-white border border-slate-200 rounded-3xl shadow-lg overflow-hidden max-w-4xl mx-auto relative mb-8">
          {confirmModal.isOpen && (
            <div className="absolute inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
              <div className="bg-white border border-slate-200 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
                <div className="w-14 h-14 bg-rose-100 rounded-full flex items-center justify-center mx-auto mb-3">
                  <svg className="w-7 h-7 text-rose-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                  </svg>
                </div>
                <h4 className="text-base font-bold text-slate-900 mb-1">ยืนยันการลบข้อมูล?</h4>
                <p className="text-xs text-slate-500 mb-5">
                  {confirmModal.type === 'location' 
                    ? `ลบพิกัด "${confirmModal.targetName}" หรือไม่?` 
                    : `ลบโปรไฟล์ใบหน้าของ "${confirmModal.targetName}" (${confirmModal.targetId}) หรือไม่?`}
                </p>
                <div className="flex gap-2.5">
                  <button onClick={() => setConfirmModal({ isOpen: false, type: '', targetId: '', targetName: '' })} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl transition text-xs font-bold">ยกเลิก</button>
                  <button onClick={executeDelete} className="flex-1 bg-rose-600 hover:bg-rose-700 text-white py-2.5 rounded-xl transition text-xs font-bold shadow-md">ยืนยันลบ</button>
                </div>
              </div>
            </div>
          )}

          <div className="flex border-b border-slate-200 bg-slate-50">
            <button onClick={()=>setActiveTab('locations')} className={`flex-1 py-3.5 font-bold text-xs md:text-sm transition ${activeTab === 'locations' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'text-slate-500 hover:text-slate-800'}`}>จุดเช็คอิน GPS</button>
            <button onClick={()=>setActiveTab('students')} className={`flex-1 py-3.5 font-bold text-xs md:text-sm transition ${activeTab === 'students' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'text-slate-500 hover:text-slate-800'}`}>ทะเบียนพนักงาน</button>
            <button onClick={()=>setActiveTab('schedule')} className={`flex-1 py-3.5 font-bold text-xs md:text-sm transition ${activeTab === 'schedule' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'text-slate-500 hover:text-slate-800'}`}>เวลาสาย</button>
            <button onClick={()=>setActiveTab('settings')} className={`flex-1 py-3.5 font-bold text-xs md:text-sm transition ${activeTab === 'settings' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'text-slate-500 hover:text-slate-800'}`}>ออกจากระบบ</button>
          </div>

          <div className="p-5 md:p-6">
            {error && <div className="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-medium">{error}</div>}
            
            {activeTab === 'locations' && (
              <div>
                <form onSubmit={handleAdd} className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 mb-6 bg-slate-50 p-4 md:p-5 rounded-2xl border border-slate-200">
                  <div className="col-span-1 sm:col-span-2">
                    <label className="text-xs font-bold text-slate-700 mb-1 block">ชื่อสถานที่</label>
                    <input required value={formData.name} onChange={e=>setFormData({...formData, name: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-slate-900 text-sm outline-none focus:border-indigo-500 transition shadow-sm" placeholder="เช่น อาคารอำนวยการ โรงพยาบาล" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 mb-1 block">ละติจูด (Latitude)</label>
                    <input required type="number" step="any" value={formData.lat} onChange={e=>setFormData({...formData, lat: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-slate-900 text-sm outline-none focus:border-indigo-500 transition shadow-sm" placeholder="13.xxx" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 mb-1 block">ลองจิจูด (Longitude)</label>
                    <input required type="number" step="any" value={formData.lng} onChange={e=>setFormData({...formData, lng: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-slate-900 text-sm outline-none focus:border-indigo-500 transition shadow-sm" placeholder="100.xxx" />
                  </div>
                  <div>
                    <label className="text-xs font-bold text-slate-700 mb-1 block">รัศมีอนุญาต (เมตร)</label>
                    <input required type="number" value={formData.radius} onChange={e=>setFormData({...formData, radius: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-slate-900 text-sm outline-none focus:border-indigo-500 transition shadow-sm" />
                  </div>
                  <div className="flex items-end gap-2">
                    <button type="button" onClick={getCurrentLoc} className="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold p-3 rounded-xl flex-1 transition text-xs shadow-sm">ดึงพิกัดปัจจุบัน</button>
                    <button type="submit" className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded-xl flex-1 transition text-xs shadow-md shadow-indigo-600/20">เพิ่มจุด GPS</button>
                  </div>
                </form>

                <div className="space-y-2.5">
                  {loadingLocs ? <p className="text-center text-slate-400 text-xs py-4">กำลังดึงรายการสถานที่...</p> : locations.map(loc => (
                    <div key={loc.id} className="flex justify-between items-center bg-white p-3.5 rounded-xl border border-slate-200 hover:border-indigo-200 transition">
                      <div>
                        <h4 className="font-bold text-slate-900 text-sm">{loc.name}</h4>
                        <p className="text-[11px] text-slate-500 mt-0.5">Lat: {loc.lat}, Lng: {loc.lng} <span className="ml-2 bg-slate-100 px-2 py-0.5 rounded-md text-slate-600 font-bold">รัศมี {loc.radius} ม.</span></p>
                      </div>
                      <button onClick={() => triggerDeleteLoc(loc.id, loc.name)} className="p-2 bg-rose-50 text-rose-600 rounded-lg hover:bg-rose-600 hover:text-white transition">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                      </button>
                    </div>
                  ))}
                  {locations.length === 0 && !loadingLocs && <p className="text-center text-xs text-slate-400 py-4">ยังไม่ได้กำหนดจุดเช็คอินเพิ่มเติม</p>}
                </div>
              </div>
            )}

            {activeTab === 'students' && (
              <div>
                <input 
                  type="text" 
                  placeholder="ค้นหาชื่อ หรือ รหัสพนักงาน..." 
                  className="w-full p-3 mb-4 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm outline-none focus:border-indigo-500 focus:bg-white transition shadow-sm"
                  value={studentSearch}
                  onChange={e => setStudentSearch(e.target.value)}
                />
                <div className="space-y-2">
                  <div className="text-slate-500 text-xs font-semibold mb-2">จำนวนพนักงานที่ลงทะเบียน: <span className="text-slate-900 font-bold">{students.length}</span> คน</div>
                  {loadingStudents ? <p className="text-center text-slate-400 text-xs py-4">กำลังโหลดข้อมูล...</p> : filteredStudents.map(u => (
                    <div key={u.id} className="flex justify-between items-center bg-white p-3.5 rounded-xl border border-slate-200 hover:border-indigo-200 transition">
                      <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-indigo-50 text-indigo-700 rounded-xl flex items-center justify-center font-bold text-sm border border-indigo-100">
                          {(u.name || 'U').substring(0, 1)}
                        </div>
                        <div>
                          <h4 className="font-bold text-slate-900 text-sm">{u.name}</h4>
                          <p className="text-xs text-slate-500">รหัส: {u.empId}</p>
                        </div>
                      </div>
                      <button onClick={() => triggerDeleteStudent(u.id, u.name)} className="p-2 bg-rose-50 text-rose-600 rounded-lg hover:bg-rose-600 hover:text-white transition">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                      </button>
                    </div>
                  ))}
                  {filteredStudents.length === 0 && !loadingStudents && <p className="text-center text-xs text-slate-400 py-4">ไม่พบรายชื่อพนักงาน</p>}
                </div>
              </div>
            )}

            {activeTab === 'schedule' && (
              <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 max-w-md mx-auto space-y-4">
                <h4 className="font-bold text-slate-900 text-sm border-b border-slate-200 pb-2">ตั้งค่าเกณฑ์เวลาสาย (Late Threshold)</h4>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">เวลาจำกัดสาย (เข้างานปกติ)</label>
                  <input type="time" value={workSchedule.normalIn} onChange={e=>setWorkSchedule({...workSchedule, normalIn: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-slate-900 text-sm outline-none" />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">เวลาจำกัดสาย (เข้าเวร)</label>
                  <input type="time" value={workSchedule.shiftIn} onChange={e=>setWorkSchedule({...workSchedule, shiftIn: e.target.value})} className="w-full p-3 bg-white border border-slate-200 rounded-xl text-slate-900 text-sm outline-none" />
                </div>
                <p className="text-[11px] text-slate-500">หากพนักงานสแกนหลังเวลาที่กำหนด ระบบจะทำเครื่องหมาย "สาย" ลงในบันทึกอัตโนมัติ</p>
              </div>
            )}

            {activeTab === 'settings' && (
              <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 text-center">
                <h3 className="text-base font-bold text-slate-800 mb-1">ออกจากระบบแอดมิน</h3>
                <p className="text-xs text-slate-500 mb-5">สลับกลับเป็นโหมดผู้ใช้งานสแกนเวลาปกติ</p>
                <button onClick={handleLogout} className="bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-md shadow-rose-600/20 text-xs inline-flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor" className="w-4 h-4"><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3.007-3H18M18 12l-3-3m3 3l-3 3" /></svg>
                  ออกจากระบบผู้ดูแล
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
